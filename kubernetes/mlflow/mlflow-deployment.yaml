apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlflow
spec:
  replicas: 1

  selector:
    matchLabels:
      app: mlflow

  template:
    metadata:
      labels:
        app: mlflow

    spec:
      containers:
      - name: mlflow
        image: kdmodder/mlflow:v2.22.2

        ports:
        - containerPort: 5000

        command: ["mlflow"]

        args:
        - server
        - --host=0.0.0.0
        - --port=5000
        - --backend-store-uri=postgresql://mlflow:mlflow123@postgres:5432/mlflow
