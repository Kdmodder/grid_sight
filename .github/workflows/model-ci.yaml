name: GridSight Model CI

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "Data/gridsight_dataset.csv.dvc"
      - "gridsight_xgboost.py"
      - "predictor/**"
      - "kserve/**"
      - "requirements.txt"

# Required so GitHub Actions can update model-version.txt
permissions:
  contents: write

jobs:
  train-build-push:
    runs-on: ubuntu-latest

    env:
      # AWS credentials for DVC S3 remote
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

      # DagsHub / MLflow
      MLFLOW_TRACKING_USERNAME: Kdmodder
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}

    steps:

      # ==================================================
      # 1. Checkout Repository
      # ==================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==================================================
      # 2. Setup Python
      # ==================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==================================================
      # 3. Install Dependencies
      # ==================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==================================================
      # 4. Verify DagsHub Authentication
      # ==================================================
      - name: Verify DagsHub authentication
        run: |
          python - <<'PY'
          import os
          import mlflow

          username = os.getenv("MLFLOW_TRACKING_USERNAME")
          token = os.getenv("MLFLOW_TRACKING_PASSWORD")

          print("Username configured:", bool(username))
          print("Token configured:", bool(token))
          print("Token length:", len(token) if token else 0)

          if not username or not token:
              raise RuntimeError("DagsHub credentials are missing")

          mlflow.set_tracking_uri(
              "https://dagshub.com/Kdmodder/GridSight.mlflow"
          )

          client = mlflow.MlflowClient()
          experiments = client.search_experiments()

          print("DagsHub MLflow authentication SUCCESS")
          print("Experiments found:", len(experiments))
          PY

      # ==================================================
      # 5. Pull Dataset From DVC / S3
      # ==================================================
      - name: Pull dataset from DVC
        run: |
          dvc pull Data/gridsight_dataset.csv.dvc

      # ==================================================
      # 6. Train XGBoost Model
      # ==================================================
      - name: Train model
        run: |
          python gridsight_xgboost.py

      # ==================================================
      # 7. Verify Champion Model
      # ==================================================
      - name: Verify champion model
        run: |
          echo "Checking generated champion model..."

          test -f models/champion_model.pkl

          ls -lh models/champion_model.pkl

          echo "Champion model verified"

      # ==================================================
      # 8. Read + Increment model-version.txt
      #
      # Example:
      # 1.0.2 -> 1.0.3
      # ==================================================
      - name: Increment model version
        id: version
        shell: bash
        run: |
          CURRENT_VERSION=$(tr -d '[:space:]' < model-version.txt)

          echo "Current version: $CURRENT_VERSION"

          if [[ ! "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: $CURRENT_VERSION"
            echo "Expected format: MAJOR.MINOR.PATCH"
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          PATCH=$((PATCH + 1))

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"

          echo "$NEW_VERSION" > model-version.txt

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          echo "New model version: $NEW_VERSION"

      # ==================================================
      # 9. Docker Hub Login
      # ==================================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ==================================================
      # 10. Build KServe Image
      # ==================================================
      - name: Build KServe image
        run: |
          docker build \
            -f kserve/Dockerfile \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/gridsight-kserve:${{ steps.version.outputs.version }} \
            .

      # ==================================================
      # 11. Verify Image BEFORE Push
      #
      # Prevents broken images from reaching Docker Hub.
      # This specifically catches the predictor issue
      # that caused the 1.0.2 CrashLoopBackOff.
      # ==================================================
      - name: Verify KServe image contents
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/gridsight-kserve:${{ steps.version.outputs.version }}"

          echo "Checking predictor..."
          docker run --rm --entrypoint sh "$IMAGE" \
            -c 'test -f /app/predictor/predictor.py'

          echo "Checking champion model..."
          docker run --rm --entrypoint sh "$IMAGE" \
            -c 'test -f /app/models/champion_model.pkl'

          echo "Checking KServe server..."
          docker run --rm --entrypoint sh "$IMAGE" \
            -c 'test -f /app/kserve/kserve_server.py'

          echo "Checking Python predictor import..."
          docker run --rm --entrypoint python "$IMAGE" \
            -c 'import predictor.predictor; print("Predictor import successful")'

          echo "KServe image verification SUCCESS"

      # ==================================================
      # 12. Push Image To Docker Hub
      # ==================================================
      - name: Push KServe image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/gridsight-kserve:${{ steps.version.outputs.version }}

      # ==================================================
      # 13. Update model-version.txt In GitHub
      #
      # Happens ONLY after successful image push.
      # ==================================================
      - name: Commit updated model version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add model-version.txt

          git commit \
            -m "chore: bump model version to ${{ steps.version.outputs.version }} [skip ci]"

          git push origin HEAD:main

      # ==================================================
      # 14. Pipeline Summary
      # ==================================================
      - name: Pipeline summary
        run: |
          echo "=========================================="
          echo "GridSight Model CI Completed Successfully"
          echo "=========================================="
          echo ""
          echo "Model version: ${{ steps.version.outputs.version }}"
          echo "Image: ${{ secrets.DOCKERHUB_USERNAME }}/gridsight-kserve:${{ steps.version.outputs.version }}"
          echo ""
          echo "DVC / S3 Dataset:       OK"
          echo "XGBoost Training:       OK"
          echo "DagsHub MLflow:         OK"
          echo "Champion Model:         OK"
          echo "KServe Image:           OK"
          echo "Docker Hub Push:        OK"
          echo "Version Update:         OK"
          echo ""
          echo "Waiting for ArgoCD Image Updater..."
