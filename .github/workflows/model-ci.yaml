name: GridSight Model CI

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "Data/gridsight_dataset.csv.dvc"
      - "gridsight_xgboost.py"
      - "predictor/**"
      - "kserve/**"
      - "requirements.txt"
      - "model-version.txt"

jobs:
  train-build-push:
    runs-on: ubuntu-latest

    env:
      MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}

      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "dvc[s3]"

      - name: Pull dataset from DVC
        run: |
          dvc pull Data/gridsight_dataset.csv.dvc

      - name: Train model
        run: |
          python gridsight_xgboost.py

      - name: Verify champion model
        run: |
          test -f models/champion_model.pkl
          ls -lh models/champion_model.pkl

      - name: Read model version
        id: version
        run: |
          VERSION=$(cat model-version.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Model version: $VERSION"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build KServe image
        run: |
          docker build \
            -f kserve/Dockerfile \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/gridsight-kserve:${{ steps.version.outputs.version }} \
            .

      - name: Push KServe image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/gridsight-kserve:${{ steps.version.outputs.version }}
